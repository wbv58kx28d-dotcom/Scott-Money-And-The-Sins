function makeSprite(scene,key,rows,pal){
  if(scene.textures.exists(key)) return;
  const h=rows.length, w=rows[0].length;
  const c=document.createElement('canvas'); c.width=w+2; c.height=h+2;
  const ctx=c.getContext('2d');
  const solid=(x,y)=>y>=0&&y<h&&x>=0&&x<w&&rows[y][x]!=='.';
  for(let y=-1;y<=h;y++) for(let x=-1;x<=w;x++){
    if(solid(x,y)){ ctx.fillStyle=pal[rows[y][x]]||'#ff00ff'; ctx.fillRect(x+1,y+1,1,1); }
    else if(solid(x-1,y)||solid(x+1,y)||solid(x,y-1)||solid(x,y+1)){ ctx.fillStyle='#0c0718'; ctx.fillRect(x+1,y+1,1,1); }
  }
  scene.textures.addCanvas(key,c);
}
function makeTextures(scene){
  makeSprite(scene,'scott',SCOTT_SPR,SCOTT_PAL);

/* ---------------- AUDIO (procedural boom-bap) ---------------- */
const Audio={
  ctx:null, muted:false, bpm:92,
  get beatMs(){ return 60000/this.bpm; },
  init(){
    if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    try{ this.ctx=new AC(); }catch(e){ return; }
    this.master=this.ctx.createGain(); this.master.gain.value=this.muted?0:0.45; this.master.connect(this.ctx.destination);
    const len=Math.floor(this.ctx.sampleRate*0.5), b=this.ctx.createBuffer(1,len,this.ctx.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    this.noiseBuf=b; this.step=0; this.next=this.ctx.currentTime+0.1;
    this.timer=setInterval(()=>this.pump(),30);
  },
  pump(){
    const spb=60/this.bpm/2;
    while(this.next<this.ctx.currentTime+0.12){ this.sched(this.step,this.next); this.next+=spb; this.step=(this.step+1)%16; }
  },
  sched(s,t){
    const p=s%8;
    if(p===0||p===3||(p===5&&s>=8)) this.kick(t);
    if(p===2||p===6) this.snare(t);
    this.hat(t,p%2?0.04:0.08);
    const bass=[33,0,0,33,0,36,0,31,29,0,0,29,0,31,0,28];
    if(bass[s]) this.tone(t,this.mtof(bass[s]),0.28,'triangle',0.32);
    if(s===0) [57,60,64].forEach(n=>this.tone(t,this.mtof(n),0.9,'triangle',0.035));
    if(s===8) [53,57,60,64].forEach(n=>this.tone(t,this.mtof(n),0.9,'triangle',0.035));
  },
  mtof(m){ return 440*Math.pow(2,(m-69)/12); },
  tone(t,f,dur,type,vol,to){
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.02);
  },
  noise(t,dur,vol,ft,freq){
    const s=this.ctx.createBufferSource(); s.buffer=this.noiseBuf;
    const f=this.ctx.createBiquadFilter(); f.type=ft; f.frequency.value=freq;
    const g=this.ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t+dur+0.02);
  },
  kick(t){ this.tone(t,140,0.22,'sine',0.9,42); },
  snare(t){ this.noise(t,0.16,0.45,'bandpass',1900); this.tone(t,190,0.08,'triangle',0.2,120); },
  hat(t,v){ this.noise(t,0.035,v,'highpass',7500); },
  sfx(n){
    if(!this.ctx) return; const t=this.ctx.currentTime+0.005;
    if(n==='blip') this.tone(t,880,0.05,'square',0.05);
    else if(n==='hit'){ this.noise(t,0.12,0.5,'lowpass',1200); this.tone(t,220,0.15,'square',0.1,80); }
    else if(n==='crit'){ this.noise(t,0.3,0.6,'lowpass',2200); this.tone(t,330,0.35,'sawtooth',0.12,55); }
    else if(n==='good') [0,4,7,12].forEach((k,i)=>this.tone(t+i*0.05,659*Math.pow(2,k/12),0.12,'square',0.06));
    else if(n==='ok') this.tone(t,523,0.1,'square',0.06);
    else if(n==='bad') this.tone(t,196,0.3,'sawtooth',0.08,100);
    else if(n==='heal') [0,5,9].forEach((k,i)=>this.tone(t+i*0.07,523*Math.pow(2,k/12),0.15,'triangle',0.1));
    else if(n==='buff') this.tone(t,300,0.45,'square',0.06,1300);
  },
  toggle(){ this.muted=!this.muted; if(this.master) this.master.gain.value=this.muted?0:0.45; return this.muted; }
};

/* ---------------- DRAW HELPERS ---------------- */
function txt(scene,x,y,s,size,color,font,extra){
  return scene.add.text(x,y,s,Object.assign({fontFamily:font||FONT,fontSize:size+'px',color:color||'#ffffff'},extra||{}));
}
function fit(t,max){ let s=parseInt(t.style.fontSize,10); while(t.width>max&&s>9){ s--; t.setFontSize(s); } return t; }
function frame(g,x,y,w,h,col,th){ g.fillStyle(col,1); g.fillRect(x,y,w,th); g.fillRect(x,y+h-th,w,th); g.fillRect(x,y,th,h); g.fillRect(x+w-th,y,th,h); }
function box(g,x,y,w,h){ g.fillStyle(0x0d0820,0.94); g.fillRect(x,y,w,h); frame(g,x,y,w,h,0xf2eaff,2); frame(g,x+4,y+4,w-8,h-8,0x4a3a7a,1); }
function bar(g,x,y,w,h,r,col){
  r=Phaser.Math.Clamp(r,0,1);
  g.fillStyle(0x000000,1).fillRect(x-1,y-1,w+2,h+2);
  g.fillStyle(0x2a2040,1).fillRect(x,y,w,h);
  const fw=Math.round(w*r);
  g.fillStyle(col,1).fillRect(x,y,fw,h);
  g.fillStyle(0xffffff,0.28).fillRect(x,y,fw,2);
}
const hpCol=r=>r>0.5?0x3ddc84:(r>0.25?0xffd166:0xff5c5c);
function drawSky(g,h){
  const bands=[0x0e0824,0x140b30,0x1a0e3c,0x211247,0x291552,0x311a5c];
  const bh=Math.ceil(h/bands.length);
  bands.forEach((c,i)=>{ g.fillStyle(c,1); g.fillRect(0,i*bh,W,bh); });
  g.fillStyle(0xffffff,0.8);
  for(let i=0;i<45;i++) g.fillRect(Phaser.Math.Between(0,W),Phaser.Math.Between(0,Math.min(h-40,170)),1,1);
}
function drawChart(g){
  g.lineStyle(3,0x2ee59d,0.35); g.beginPath(); g.moveTo(10,180);
  [[60,150],[100,166],[150,110],[190,126],[240,58]].forEach(p=>g.lineTo(p[0],p[1])); g.strokePath();
  g.lineStyle(3,0xff5c5c,0.42); g.beginPath(); g.moveTo(240,58);
  [[268,140],[296,118],[350,196]].forEach(p=>g.lineTo(p[0],p[1])); g.strokePath();
}
function typeMult(type,def){ if(!type) return 1; if(def.weak.includes(type)) return 2; if(def.resist.includes(type)) return 0.5; return 1; }
function hitCalc(type,target,def){
  const base=typeMult(type,def);
  const soft=!!(type&&target&&def.soft&&def.soft[type]&&def.soft[type].includes(target));
  if(!soft) return {mult:base,kind:base>1?'weak':(base<1?'resist':'normal'),soft:false};
  if(base>1) return {mult:base*CRIT,kind:'crit',soft:true};
  if(base<1) return {mult:1,kind:'bypass',soft:true};
  return {mult:NERVE,kind:'nerve',soft:true};
}

  create(){
    makeTextures(this);
    this.tapResolver=null; this.overlayOpen=false; this.menu=null; this.flashTok=0;
    this.st={
      scott:{clout:SCOTT.maxClout,max:SCOTT.maxClout,flow:SCOTT.maxFlow,maxFlow:SCOTT.maxFlow,status:{moon:0,rug:0}},
      enemy:{clout:ENEMY.maxClout,max:ENEMY.maxClout,squeezed:false,rev:{weak:false,resist:false,soft:[]}},
      crowd:0, items:{brew:2,vm:1}, turn:0
    };
    this.disp={sc:SCOTT.maxClout,sf:SCOTT.maxFlow,ec:ENEMY.maxClout,cr:0};
    this.buildStage(); this.buildFighters(); this.buildHUD(); this.buildPanel(); this.buildCorner();
    this.input.removeAllListeners('pointerdown');
    this.input.on('pointerdown',(p,over)=>{
      if(this.overlayOpen) return;
      if(over&&over.length) return;
      if(this.tapResolver){ const r=this.tapResolver; this.tapResolver=null; r(); }
    });
    this.redrawHUD();
    this.loop();
  }

  /* ----- scene building ----- */
  buildStage(){
    const g=this.add.graphics().setDepth(0);
    drawSky(g,204); drawChart(g);
    let x=0;
    while(x<W){
      const w=Phaser.Math.Between(14,30), h=Phaser.Math.Between(18,62);
      g.fillStyle(0x0a0618,1); g.fillRect(x,204-h,w-2,h);
      g.fillStyle(0xffd166,0.35);
      for(let wy=204-h+4;wy<198;wy+=7) for(let wx=x+3;wx<x+w-5;wx+=6) if(Math.random()<0.3) g.fillRect(wx,wy,2,3);
      x+=w;

  /* ----- UI primitives ----- */
  button(x,y,w,h,lines,o={}){
    const c=this.add.container(0,0).setDepth(o.depth||20);
    const g=this.add.graphics(); c.add(g);
    const accent=o.accent!=null?o.accent:0xf2eaff;
    const paint=down=>{
      g.clear();
      const base=o.fill!=null?o.fill:0x241a46;
      g.fillStyle(o.disabled?0x17112b:(down?0x40307a:base),1); g.fillRect(x,y,w,h);
      frame(g,x,y,w,h,o.disabled?0x4a3a7a:accent,2);
    };
    paint(false);
    let ty=y+(o.padY!=null?o.padY:8);
    c.texts=[];
    lines.forEach(l=>{
      const t=txt(this,o.center?x+w/2:x+10,ty,l.t,l.size||20,l.color||'#ffffff',l.font||FONT);
      if(o.center) t.setOrigin(0.5,0);
      fit(t,w-16); if(o.disabled) t.setAlpha(0.45);
      c.add(t); c.texts.push(t); ty+=t.height+(l.gap!=null?l.gap:2);
    });
    const z=this.add.zone(x,y,w,h).setOrigin(0).setInteractive({useHandCursor:true}); c.add(z);
    z.on('pointerdown',()=>paint(true));
    z.on('pointerout',()=>paint(false));
    z.on('pointerup',()=>{ paint(false); Audio.sfx('blip'); if(o.onClick) this.time.delayedCall(1,o.onClick); });
    return c;
  }

  wait(ms){ return new Promise(r=>this.time.delayedCall(ms,r)); }

  say(text,waitForTap=true){
    return new Promise(res=>{
      this.arrow.setVisible(false);
      this.dlg.setText('');
      let i=0;
      const finish=()=>{
        this.dlg.setText(text);
        if(!waitForTap){ res(); return; }
        this.arrow.setVisible(true);
        this.tapResolver=()=>{ this.arrow.setVisible(false); res(); };
      };
      const ev=this.time.addEvent({delay:16,loop:true,callback:()=>{
        i+=1; this.dlg.setText(text.slice(0,i));
        if(i>=text.length){ ev.remove(); finish(); }
      }});
      this.tapResolver=()=>{ ev.remove(); finish(); };
    });
  }

  flash(msg){
    const tok=++this.flashTok, prev=this.dlg.text;
    this.dlg.setText(msg);
    this.time.delayedCall(1500,()=>{ if(tok===this.flashTok&&this.menu) this.dlg.setText(prev); });

  hitFx(spr,dmg,res){
    const big=res.mult>1;
    Audio.sfx(big?'crit':'hit');
    let n=0;
    this.time.addEvent({delay:70,repeat:5,callback:()=>{
      n++; if(n%2) spr.setTintFill(0xffffff); else this.reTint(spr);
      if(n>=6) this.reTint(spr);
    }});
    if(big) this.cameras.main.shake(res.kind==='crit'?320:220,res.kind==='crit'?0.02:0.012);
    const col=big?'#ffd166':(res.mult<1?'#9a92b8':'#ffffff');
    const label=(res.kind==='crit'?'CRIT ':'')+'-'+dmg;
    const t=txt(this,spr.x,spr.y-72,label,big?18:14,col,PIX,{stroke:'#000000',strokeThickness:5}).setOrigin(0.5).setDepth(9);
    this.tweens.add({targets:t,y:t.y-34,alpha:0,duration:1100,ease:'Quad.out',onComplete:()=>t.destroy()});

  /* ----- beat-timing minigame ----- */
  timing(speed){
    return new Promise(res=>{
      const c=this.add.container(0,0).setDepth(25);
      const g=this.add.graphics(); c.add(g);
      const y=562, x0=40, x1=320, cx=180, half=140;
      g.fillStyle(0x0a0618,1).fillRect(x0-8,y-20,(x1-x0)+16,40);
      frame(g,x0-8,y-20,(x1-x0)+16,40,0xf2eaff,2);
      const band=(r,col)=>{ g.fillStyle(col,1); g.fillRect(Math.round(cx-r*half),y-14,Math.round(r*half*2),28); };
      band(0.36,0x3a2a6a); band(0.20,0xff8c42); band(0.08,0xffd166);
      const prompt=txt(this,W/2,y-50,'TAP ON THE BEAT!',12,'#ffd166',PIX).setOrigin(0.5); c.add(prompt);
      this.tweens.add({targets:prompt,alpha:0.3,duration:Audio.beatMs/2,yoyo:true,repeat:-1});
      const fromLeft=Math.random()<0.5;
      const marker=this.add.rectangle(fromLeft?x0:x1,y,6,36,0xffffff); c.add(marker);
      const tw=this.tweens.add({targets:marker,x:fromLeft?x1:x0,duration:Math.round(820/speed),yoyo:true,repeat:-1,ease:'Linear'});
      const start=this.time.now;
      const handler=()=>{
        if(this.time.now-start<150){ this.tapResolver=handler; return; }
        tw.stop();
        const d=Math.abs(marker.x-cx)/half;
        const r=RATINGS.find(q=>d<=q.max);
        Audio.sfx(r.sfx);
        const lbl=txt(this,W/2,y+30,r.label,16,r.color,PIX,{stroke:'#000000',strokeThickness:4}).setOrigin(0.5,0); c.add(lbl);
        this.tweens.add({targets:lbl,scale:{from:1.6,to:1},duration:200,ease:'Back.out'});
        this.time.delayedCall(750,()=>{ this.tweens.killTweensOf(prompt); this.tweens.killTweensOf(lbl); c.destroy(); res(r); });
      };
      this.tapResolver=handler;
    });
  }

  /* ----- battle flow ----- */
  async loop(){
    await this.wait(750);
    await this.say(`${ENEMY.name} blocks the path!`);
    await this.say(`${ENEMY.short}:\n"Your stock's crashin', Money.\nI'm BUYING THE DIP."`);
    await this.say("Every rival has weaknesses and soft spots.\nTap ? up top for the cheat sheet.");
    while(true){
      this.st.turn++;
      await this.playerTurn();
      if(this.st.enemy.clout<=0) return this.win();
      await this.enemyTurn();
      if(this.st.scott.clout<=0) return this.lose();
      await this.endRound();
    }
  }

  async playerTurn(){
    const s=this.st, sc=s.scott;
    if(sc.status.rug>0){
      sc.flow=Math.max(0,sc.flow-8); sc.status.rug--; this.tweenHUD();
      await this.say(`The rug is still pulled. $cott bleeds 8 Flow.${sc.status.rug===0?"\n...He finds a new rug. It's fine.":''}`);
    } else if(s.turn>1){ sc.flow=Math.min(sc.maxFlow,sc.flow+5); this.tweenHUD(); }
    while(true){
      const a=await this.chooseAction();
      if(a.kind==='run'){ await this.say("$cott Money doesn't run. He PIVOTS.\n...There's nowhere to pivot to."); continue; }
      if(a.kind==='item') return this.useItem(a.item);
      if(a.kind==='mic') return this.attack(MIC_DROP,true);
      if(a.kind==='move') return this.attack(a.move,false,a.target);
    }
  }

  async useItem(item){
    const s=this.st, sc=s.scott;
    Audio.sfx('heal');
    if(item==='brew'){
      s.items.brew--; sc.flow=Math.min(sc.maxFlow,sc.flow+30); this.tweenHUD();
      await this.say("$cott slams a Cold Brew. Single origin. Ethically sourced. Probably.\n+30 Flow");
    } else {
      s.items.vm--; sc.clout=Math.min(sc.max,sc.clout+35); this.tweenHUD();
      await this.say("$cott replays a voicemail from his hype man:\n\"Bro. You're HIM. You're literally HIM.\"\n+35 Clout");
    }
  }

  async attack(move,isMic,target){
    const s=this.st, sc=s.scott, e=s.enemy;
    if(!isMic){ sc.flow-=move.cost; this.tweenHUD(); }
    this.arrow.setVisible(false);
    this.dlg.setText(`$COTT MONEY spits ${move.name}!${target?`\nTarget: ${target}`:''}`);

    if(move.buff){
      await this.wait(400);
      await this.lunge(this.scottSpr,1);
      const b=pick(move.bars);
      await this.say(`$COTT:\n${b[0]}\n${b[1]}`);
      sc.status.moon=3; Audio.sfx('buff'); this.reTint(this.scottSpr);
      s.crowd=Math.min(100,s.crowd+8); this.tweenHUD();
      await this.say("$cott is MOONING! His damage is way up, but he's wide open. (3 turns)");
      return;
    }

    const r=await this.timing(move.speed||1);
    await this.lunge(this.scottSpr,1);
    const pool=isMic?ENEMY.micBars:((ENEMY.scottBars[move.type]||{})[target]||[["*mumbles something about synergy*","*it does not land*"]]);
    const b=pick(pool);
    await this.say(`$COTT:\n${b[0]}\n${b[1]}`);

    const res=isMic?{mult:1,kind:'normal',soft:false}:hitCalc(move.type,target,ENEMY);
    const dmg=Math.max(1,Math.round(move.power*r.mult*res.mult*(sc.status.moon?1.5:1)*Phaser.Math.FloatBetween(0.9,1.1)));
    e.clout=Math.max(0,e.clout-dmg);
    const bonus={crit:20,weak:10,bypass:12,nerve:12,resist:-5,normal:0}[res.kind];
    if(isMic) s.crowd=0;
    else s.crowd=Phaser.Math.Clamp(s.crowd+r.crowd+bonus,0,100);
    this.hitFx(this.enemySpr,dmg,res); this.tweenHUD();
    if(r.crowd>=18||res.mult>1||isMic) this.crowdJump();
    if(res.soft&&!e.rev.soft.includes(target)) e.rev.soft.push(target);
    const why=res.soft?(ENEMY.softMsg[target]||''):'';

    if(res.kind==='crit'){ e.rev.weak=true; this.redrawHUD(); await this.say(`CRITICAL! Soft spot found: ${target}.\n${why}`); }
    else if(res.kind==='bypass'){ e.rev.resist=true; this.redrawHUD(); await this.say(`Crack in the armor: ${target}!\nHis ${move.type} resistance doesn't matter here.\n${why}`); }
    else if(res.kind==='nerve'){ this.redrawHUD(); await this.say(`Hit a nerve: ${target}!\n${why}`); }
    else if(res.kind==='weak'){ e.rev.weak=true; this.redrawHUD(); await this.say(pick(["IT'S A BODY BAG!\nSuper effective.","OHHHH! The crowd felt that one.\nSuper effective."])); }
    else if(res.kind==='resist'){ e.rev.resist=true; this.redrawHUD(); await this.say(ENEMY.resistMsg[move.type]||"Weak bars.\nNot very effective."); }
    else await this.wait(550);

    if(isMic&&e.clout>0) await this.say("The crowd loses it. $cott drops the mic.\nHe'll expense a new one.");

    if(e.clout>0&&!e.squeezed&&e.clout<=e.max*0.4){
      e.squeezed=true; this.reTint(this.enemySpr); this.cameras.main.flash(250,255,80,80);
      await this.say("Derek is getting SHORT SQUEEZED!\nHe has never felt more alive. Derek's damage is UP!");
    }
  }

  async enemyTurn(){
    const s=this.st, sc=s.scott, e=s.enemy, moves=ENEMY.moves;
    let mv;
    if(!sc.status.rug&&sc.flow>=15&&Math.random()<0.3) mv=moves.find(m=>m.inflict==='rug');
    else {
      const pool=moves.filter(m=>m.weight), tot=pool.reduce((a,m)=>a+m.weight,0);
      let r=Math.random()*tot; mv=pool.find(m=>(r-=m.weight)<0)||pool[0];
    }
    this.arrow.setVisible(false);
    this.dlg.setText(`${ENEMY.short} fires back with ${mv.name}!${mv.target?`\nTarget: ${mv.target}`:''}`);
    await this.wait(850);
    await this.lunge(this.enemySpr,-1);
    const b=pick(mv.bars);
    await this.say(`${ENEMY.short}:\n${b[0]}\n${b[1]}`);

    const res=hitCalc(mv.type,mv.target,SCOTT);
    const dmg=Math.max(1,Math.round(mv.power*res.mult*(e.squeezed?1.3:1)*(sc.status.moon?1.25:1)*Phaser.Math.FloatBetween(0.85,1.15)));
    sc.clout=Math.max(0,sc.clout-dmg); s.crowd=Math.max(0,s.crowd-(res.kind==='crit'?10:4));
    this.hitFx(this.scottSpr,dmg,res); this.tweenHUD();
    const why=res.soft?(SCOTT.softMsg[mv.target]||''):'';

    if(res.kind==='crit') await this.say(`CRITICAL! ${ENEMY.short} went for the ${mv.target.toLowerCase()}.\n${why}`);
    else if(res.kind==='bypass') await this.say(`${ENEMY.short} found a crack in the armor: ${mv.target}!\n$cott's ${mv.type} resistance doesn't matter here.\n${why}`);
    else if(res.kind==='nerve') await this.say(`That hit a nerve.\n${why}`);
    else if(res.kind==='weak') await this.say(pick(["Right in the ego.\nSuper effective.","That one's going in the group chat.\nSuper effective."]));
    else if(res.kind==='resist') await this.say(SCOTT_RESIST_MSG[mv.type]||"$cott barely noticed.\nNot very effective.");
    else await this.wait(500);

    if(mv.inflict==='rug'&&!sc.status.rug&&sc.clout>0){
      sc.status.rug=2; this.redrawHUD();
      await this.say("$cott got RUG PULLED!\nHe'll bleed Flow for the next 2 turns.");
    }
  }

  async endRound(){
    const sc=this.st.scott;
    if(sc.status.moon>0){
      sc.status.moon--; this.redrawHUD();
      if(sc.status.moon===0){ this.reTint(this.scottSpr); await this.say("$cott comes back down to Earth.\nMOONING wore off."); }
    }
  }

  async win(){
    if(this.enemyBob) this.enemyBob.stop();
    Audio.sfx('crit'); this.crowdJump();
    this.tweens.add({targets:this.enemySpr,alpha:0,y:'+=30',angle:-20,duration:800});
    await this.say(`${ENEMY.name} got DELISTED!`);
    await this.say(`${ENEMY.short}:\n"I... I still like the stock."\n*logs off to touch grass*`);
    this.endScreen(true);
  }

  async lose(){
    if(this.scottBob) this.scottBob.stop();
    Audio.sfx('bad');
    this.tweens.add({targets:this.scottSpr,angle:90,y:'+=24',alpha:0.5,duration:700});
    await this.say("$COTT MONEY got RATIO'D.\nHis Clout is now worth less than a meme coin.");
    this.endScreen(false);
  }

  endScreen(won){
    this.clearMenu(); this.overlayOpen=true;
    const c=this.add.container(0,0).setDepth(50);
    c.add(this.add.rectangle(0,0,W,H,0x07040f,0.9).setOrigin(0).setInteractive());
    c.add(txt(this,W/2,170,won?'DELISTED!':"RATIO'D",24,won?'#ffd166':'#ff5c8a',PIX,{stroke:'#000000',strokeThickness:6}).setOrigin(0.5));
    const body=won
      ? `+250 Clout\n+1 Derek's gaming chair (useless)\nSoft spots found: ${this.st.enemy.rev.soft.length}/${SOFT_TOTAL}\n\n$cott's first step back to the top.\nNext stop: the overworld map.\n(Coming soon.)`
      : "$cott's Clout hit zero.\n\nDerek is weak to FLEX, and some targets hurt him way more than others. Experiment.";
    c.add(txt(this,W/2,222,body,22,'#f2eaff',FONT,{align:'center',wordWrap:{width:316}}).setOrigin(0.5,0));
    this.button(70,480,220,56,[{t:'RUN IT BACK',size:12,font:PIX,color:'#ffd166'}],
      {center:true,padY:22,depth:60,accent:0xffd166,onClick:()=>this.scene.restart()});
  }
}

/* ---------------- BOOT ---------------- */
const boot=()=>new Phaser.Game({
  type:Phaser.AUTO, parent:'game', width:W, height:H, backgroundColor:'#0b0716',
  pixelArt:true, roundPixels:true, audio:{noAudio:true},
  scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},
  scene:[Title,Battle]
});
let started=false; const go=()=>{ if(!started){ started=true; boot(); } };
try{
  Promise.all([document.fonts.load('22px VT323'),document.fonts.load('12px "Press Start 2P"')]).then(go,go);
  setTimeout(go,2500);
}catch(e){ go(); }
})();
</script>
</body>
